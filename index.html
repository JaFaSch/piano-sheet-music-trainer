<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Note Trainer" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Note Trainer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #ffffff; --bg2: #f5f4f0; --text: #2c2c2a; --text2: #888780;
      --border2: rgba(0,0,0,0.28); --ledger: rgba(44,44,42,0.3);
      --green-bg: #eaf3de; --green-text: #3b6d11; --green-border: rgba(59,109,17,0.4);
      --red-bg: #fcebeb; --red-text: #a32d2d; --red-border: rgba(163,45,45,0.4);
      --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1c; --bg2: #2a2a28; --text: #d0cfc8; --text2: #888780;
        --border2: rgba(255,255,255,0.28); --ledger: rgba(208,207,200,0.35);
        --green-bg: #173404; --green-text: #c0dd97; --green-border: rgba(192,221,151,0.4);
        --red-bg: #501313; --red-text: #f09595; --red-border: rgba(240,149,149,0.4);
      }
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
    #app { width: 100%; max-width: 420px; }
    #midi-status { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--text2); margin-bottom: 10px; min-height: 18px; }
    #midi-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); flex-shrink: 0; }
    #midi-dot.connected { background: #3b6d11; }
    #midi-dot.connected + #midi-label { color: #3b6d11; }
    #clef-label { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 8px; letter-spacing: 0.04em; }
    #staff-wrap { margin-bottom: 1.25rem; }
    #staff-wrap svg { width: 100%; height: auto; display: block; }
    #feedback { height: 26px; text-align: center; font-size: 15px; font-weight: 500; margin-bottom: 0.6rem; }
    #attempts-wrap { text-align: center; font-size: 18px; letter-spacing: 6px; color: var(--text2); margin-bottom: 1.25rem; min-height: 24px; }
    #btn-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
    .note-btn { padding: 14px 0; font-size: 16px; font-weight: 500; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.12s, color 0.12s, border-color 0.12s; touch-action: manipulation; }
    .note-btn:active { opacity: 0.7; transform: scale(0.95); }
    .flash-green { background: var(--green-bg) !important; color: var(--green-text) !important; border-color: var(--green-border) !important; }
    .flash-red { background: var(--red-bg) !important; color: var(--red-text) !important; border-color: var(--red-border) !important; }
    #score-row { display: flex; justify-content: center; gap: 2.5rem; margin-top: 1.5rem; }
    .score-card { text-align: center; }
    .score-label { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
    .score-val { font-size: 24px; font-weight: 500; }
    #mnemonics { margin-top: 1.75rem; border-top: 0.5px solid var(--border2); padding-top: 1.25rem; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mnem-card { background: var(--bg2); border-radius: var(--radius); padding: 10px 12px; }
    .mnem-title { font-size: 11px; color: var(--text2); margin-bottom: 4px; letter-spacing: 0.04em; }
    .mnem-notes { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
    .mnem-phrase { font-size: 12px; color: var(--text2); line-height: 1.4; }
  </style>
</head>
<body>
<div id="app">
  <div id="midi-status">
    <div id="midi-dot"></div>
    <span id="midi-label">no midi device</span>
  </div>
  <div id="clef-label"></div>
  <div id="staff-wrap">
    <svg id="staff-svg" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="feedback"></div>
  <div id="attempts-wrap"></div>
  <div id="btn-grid">
    <button class="note-btn" data-note="C">C</button>
    <button class="note-btn" data-note="D">D</button>
    <button class="note-btn" data-note="E">E</button>
    <button class="note-btn" data-note="F">F</button>
    <button class="note-btn" data-note="G">G</button>
    <button class="note-btn" data-note="A">A</button>
    <button class="note-btn" data-note="B">B</button>
  </div>
  <div id="score-row">
    <div class="score-card"><div class="score-label">correct</div><div class="score-val" id="sc-correct">0</div></div>
    <div class="score-card"><div class="score-label">wrong</div><div class="score-val" id="sc-wrong">0</div></div>
  </div>
  <div id="mnemonics">
    <div class="mnem-card">
      <div class="mnem-title">treble lines</div>
      <div class="mnem-notes">E G B D F</div>
      <div class="mnem-phrase">Every Good Boy Does Fine</div>
    </div>
    <div class="mnem-card">
      <div class="mnem-title">treble spaces</div>
      <div class="mnem-notes">F A C E</div>
      <div class="mnem-phrase">FACE</div>
    </div>
    <div class="mnem-card">
      <div class="mnem-title">bass lines</div>
      <div class="mnem-notes">G B D F A</div>
      <div class="mnem-phrase">Good Boys Do Fine Always</div>
    </div>
    <div class="mnem-card">
      <div class="mnem-title">bass spaces</div>
      <div class="mnem-notes">A C E G</div>
      <div class="mnem-phrase">All Cows Eat Grass</div>
    </div>
  </div>
</div>
<script>
const TREBLE = [
  {note:'A',pos:-4},{note:'B',pos:-3},
  {note:'C',pos:-2},{note:'D',pos:-1},
  {note:'E',pos:0},{note:'F',pos:1},{note:'G',pos:2},{note:'A',pos:3},{note:'B',pos:4},
  {note:'C',pos:5},{note:'D',pos:6},{note:'E',pos:7},{note:'F',pos:8},{note:'G',pos:9},
  {note:'A',pos:10},{note:'B',pos:11},{note:'C',pos:12},
];
const BASS = [
  {note:'C',pos:-4},{note:'D',pos:-3},
  {note:'E',pos:-2},{note:'F',pos:-1},
  {note:'G',pos:0},{note:'A',pos:1},{note:'B',pos:2},{note:'C',pos:3},{note:'D',pos:4},
  {note:'E',pos:5},{note:'F',pos:6},{note:'G',pos:7},{note:'A',pos:8},{note:'B',pos:9},
  {note:'C',pos:10},{note:'D',pos:11},{note:'E',pos:12},
];

const MIDI_NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

let clef, currentNote, attemptsLeft, correct=0, wrong=0, locked=false;
const svg = document.getElementById('staff-svg');
const feedback = document.getElementById('feedback');
const attemptsWrap = document.getElementById('attempts-wrap');
const clefLabel = document.getElementById('clef-label');
const midiDot = document.getElementById('midi-dot');
const midiLabel = document.getElementById('midi-label');

function getCSSVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function drawStaff(noteObj) {
  const c = getCSSVar('--text'), lc = getCSSVar('--ledger');
  const staffTop = 48, lineGap = 10, noteR = 6;
  let h = '';
  for (let i = 1; i <= 2; i++) {
    const y = staffTop - i * lineGap;
    h += `<line x1="40" x2="440" y1="${y}" y2="${y}" stroke="${lc}" stroke-width="1" stroke-dasharray="4 4"/>`;
  }
  for (let i = 0; i < 5; i++) {
    const y = staffTop + i * lineGap;
    h += `<line x1="40" x2="440" y1="${y}" y2="${y}" stroke="${c}" stroke-width="1.2"/>`;
  }
  for (let i = 1; i <= 2; i++) {
    const y = staffTop + 4 * lineGap + i * lineGap;
    h += `<line x1="40" x2="440" y1="${y}" y2="${y}" stroke="${lc}" stroke-width="1" stroke-dasharray="4 4"/>`;
  }
  if (clef === 'treble') {
    h += `<text x="44" y="${staffTop+36}" font-size="52" fill="${c}" font-family="serif">𝄞</text>`;
  } else {
    h += `<text x="44" y="${staffTop+12}" font-size="34" fill="${c}" font-family="serif">𝄢</text>`;
  }
  const bottomY = staffTop + 4 * lineGap, nx = 270;
  const ny = bottomY - (noteObj.pos * (lineGap / 2));
  // Debug: each diatonic step = lineGap/2 pixels
  // Ledger lines below staff: even positions -2 and -4
  if (noteObj.pos <= -2) {
    for (let p = -2; p >= noteObj.pos; p -= 2) {
      const ly = bottomY - p*(lineGap/2);
      h += `<line x1="${nx-11}" x2="${nx+11}" y1="${ly}" y2="${ly}" stroke="${c}" stroke-width="1.4"/>`;
    }
  }
  // Ledger lines above staff: even positions 10 and 12
  if (noteObj.pos >= 10) {
    for (let p = 10; p <= noteObj.pos; p += 2) {
      const ly = bottomY - p*(lineGap/2);
      h += `<line x1="${nx-11}" x2="${nx+11}" y1="${ly}" y2="${ly}" stroke="${c}" stroke-width="1.4"/>`;
    }
  }
  h += `<ellipse cx="${nx}" cy="${ny}" rx="${noteR}" ry="${noteR*0.78}" fill="${c}" transform="rotate(-15,${nx},${ny})"/>`;
  const sd = noteObj.pos >= 5 ? 1 : -1;
  const sy1 = ny + sd*noteR*0.78, sy2 = sy1 + sd*30, sx = nx + (sd>0 ? -noteR : noteR);
  h += `<line x1="${sx}" x2="${sx}" y1="${sy1}" y2="${sy2}" stroke="${c}" stroke-width="1.2"/>`;
  svg.innerHTML = h;
}

function updateAttempts() {
  attemptsWrap.textContent = ['●','●','●'].map((_,i) => i < attemptsLeft ? '●' : '○').join(' ');
}

function flashBtn(note, type) {
  const btn = document.querySelector(`.note-btn[data-note="${note}"]`);
  if (!btn) return;
  btn.classList.add(type === 'green' ? 'flash-green' : 'flash-red');
  setTimeout(() => btn.classList.remove('flash-green','flash-red'), 500);
}

function handleGuess(guess) {
  if (locked || !currentNote) return;
  if (guess === currentNote.note) {
    flashBtn(guess, 'green');
    feedback.textContent = 'correct!';
    feedback.style.color = 'var(--green-text)';
    correct++;
    document.getElementById('sc-correct').textContent = correct;
    locked = true;
    setTimeout(nextRound, 700);
  } else {
    flashBtn(guess, 'red');
    attemptsLeft--;
    updateAttempts();
    if (attemptsLeft <= 0) {
      feedback.textContent = `the note was ${currentNote.note}`;
      feedback.style.color = 'var(--red-text)';
      wrong++;
      document.getElementById('sc-wrong').textContent = wrong;
      locked = true;
      setTimeout(nextRound, 1200);
    } else {
      feedback.textContent = 'try again';
      feedback.style.color = 'var(--text2)';
    }
  }
}

function nextRound() {
  clef = Math.random() < 0.5 ? 'treble' : 'bass';
  clefLabel.textContent = clef === 'treble' ? 'treble clef' : 'bass clef';
  const pool = clef === 'treble' ? TREBLE : BASS;
  currentNote = pool[Math.floor(Math.random() * pool.length)];
  attemptsLeft = 3;
  feedback.textContent = '';
  feedback.style.color = '';
  updateAttempts();
  drawStaff(currentNote);
  locked = false;
  document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('flash-green','flash-red'));
}

document.querySelectorAll('.note-btn').forEach(btn => {
  btn.addEventListener('click', () => handleGuess(btn.dataset.note));
});

function setMidiStatus(connected, name) {
  if (connected) {
    midiDot.className = 'connected';
    midiLabel.textContent = name || 'piano connected';
  } else {
    midiDot.className = '';
    midiLabel.textContent = 'no midi device';
  }
}

function onMidiMessage(event) {
  const [status, note, velocity] = event.data;
  const isNoteOn = (status & 0xf0) === 0x90 && velocity > 0;
  if (!isNoteOn) return;
  const noteName = MIDI_NOTE_NAMES[note % 12];
  if (noteName.includes('#')) return;
  handleGuess(noteName);
}

function connectMidi(access) {
  let connected = false;
  access.inputs.forEach(input => {
    input.onmidimessage = onMidiMessage;
    setMidiStatus(true, input.name);
    connected = true;
  });
  if (!connected) setMidiStatus(false);
  access.onstatechange = (e) => {
    if (e.port.type === 'input') {
      if (e.port.state === 'connected') {
        e.port.onmidimessage = onMidiMessage;
        setMidiStatus(true, e.port.name);
      } else {
        setMidiStatus(false);
      }
    }
  };
}

if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess({ sysex: false }).then(
    access => connectMidi(access),
    () => setMidiStatus(false)
  );
} else {
  midiLabel.textContent = 'midi not supported';
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
nextRound();
</script>
</body>
</html>
